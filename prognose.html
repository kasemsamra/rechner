<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zählerstand Prognose</title>
    <meta name="author" content="KasemSamra">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
     <link rel="icon" href="bg.jpg">
    <style>
        :root {
            --primary: #e30613;
            --primary-dark: #bf0b10;
            --gradient-start: #ff4b1f;
            --gradient-end: #ff9068;
            --background: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-light: #ffffff;
            --text-gray: #cccccc;
            --animation-speed: 0.3s;
            --shadow-color: rgba(227, 6, 19, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--background);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        .loader {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: relative;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.95); opacity: 0.8; }
        }

        header {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            padding: 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .header-content {
            display: flex;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            transition: all var(--animation-speed);
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            transform: translateX(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .title-container {
            flex-grow: 1;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-light);
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .calculator-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-field {
            position: relative;
        }

        label {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all var(--animation-speed);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--shadow-color);
        }

        .calculate-button {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: var(--text-light);
            border: none;
            padding: 1.25rem 2.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            max-width: 400px;
            margin: 2rem auto;
            display: block;
            transition: all var(--animation-speed);
            position: relative;
            overflow: hidden;
        }

        .calculate-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gradient-end), var(--gradient-start));
            opacity: 0;
            transition: opacity var(--animation-speed);
        }

        .calculate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .calculate-button:hover::before {
            opacity: 1;
        }

        .calculate-button span {
            position: relative;
            z-index: 1;
        }

        #result {
            margin-top: 2rem;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            font-size: 1.2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
            background: rgba(255, 255, 255, 0.05);
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-content {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-color);
        }

        .error-message {
            color: var(--primary);
            background: rgba(227, 6, 19, 0.1);
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .title {
                font-size: 2rem;
            }

            main {
                padding: 1rem;
            }

            .calculator-card {
                padding: 1.5rem;
            }

            .form-section {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
    </div>

    <header>
        <div class="header-content">
            <button class="back-button" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
                <span>Zurück</span>
            </button>
            <div class="title-container">
                <h1 class="title">Zählerstand Prognose</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="calculator-card">
            <form onsubmit="calculateFutureReading(event)">
                <div class="form-section">
                    <div class="input-group">
                        <div class="input-field">
                            <label for="startDate">Letzte Ablesung</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div class="input-field">
                            <label for="startReading">Zählerstand bei der letzten Ablesung</label>
                            <input type="number" id="startReading" placeholder="z.B. 45678" step="0.01" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <div class="input-field">
                            <label for="currentDate">Aktuelle Ablesung</label>
                            <input type="date" id="currentDate" required>
                        </div>
                        <div class="input-field">
                            <label for="currentReading">Aktueller Zählerstand</label>
                            <input type="number" id="currentReading" placeholder="z.B. 46789" step="0.01" required>
                        </div>
                    </div>
                </div>

                <div class="input-field" style="max-width: 400px; margin: 0 auto;">
                    <label for="futureDate">Zu errechnender Zählerstand</label>
                    <input type="date" id="futureDate" required>
                </div>

                <button type="submit" class="calculate-button">
                    <span>Berechnen</span>
                </button>
            </form>

            <div id="result"></div>
        </div>
    </main>

   <script>
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const loadingScreen = document.getElementById('loadingScreen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        }, 1000);

        // Set default dates
        const today = new Date();
        const lastMonth = new Date(today);
        lastMonth.setMonth(today.getMonth() - 1);
        
        document.getElementById('startDate').valueAsDate = lastMonth;
        document.getElementById('currentDate').valueAsDate = today;
        document.getElementById('futureDate').valueAsDate = today;
    });

    function calculateFutureReading(event) {
        event.preventDefault();
        
        const startDate = new Date(document.getElementById('startDate').value);
        const startReading = parseFloat(document.getElementById('startReading').value);
        const currentDate = new Date(document.getElementById('currentDate').value);
        const currentReading = parseFloat(document.getElementById('currentReading').value);
        const futureDate = new Date(document.getElementById('futureDate').value);

        const resultElement = document.getElementById('result');
        resultElement.classList.remove('show');

        // Nur noch eine Validierung für logische Zählerstände
        if (currentReading < startReading) {
            showError("Der aktuelle Zählerstand kann nicht niedriger sein als der letzte Zählerstand.");
            return;
        }

        // Berechnung des täglichen Verbrauchs
        const daysPassed = Math.abs((currentDate - startDate) / (1000 * 60 * 60 * 24));
        if (daysPassed === 0) {
            showError("Start- und Enddatum können nicht identisch sein.");
            return;
        }

        const dailyUsage = (currentReading - startReading) / daysPassed;
        // Berechnung der Tage zum Zieldatum (kann positiv oder negativ sein)
        const daysToFuture = (futureDate - currentDate) / (1000 * 60 * 60 * 24);
        const futureReading = currentReading + (dailyUsage * daysToFuture);

        const formattedFutureDate = futureDate.toLocaleDateString('de-DE', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
        });

        resultElement.innerHTML = `
            <div class="result-content">
                <p>Berechneter Zählerstand am ${formattedFutureDate}:</p>
                <h2 style="font-size: 2rem; margin-top: 0.5rem;">${futureReading.toFixed(2)}</h2>
                <p style="font-size: 0.9rem; margin-top: 1rem; opacity: 0.8;">
                    Basierend auf einem durchschnittlichen Verbrauch von ${Math.abs(dailyUsage).toFixed(2)} Einheiten pro Tag
                </p>
            </div>
        `;
        
        setTimeout(() => resultElement.classList.add('show'), 50);
    }

    function showError(message) {
        const resultElement = document.getElementById('result');
        resultElement.innerHTML = `<div class="error-message">${message}</div>`;
        resultElement.classList.add('show');
    }

    document.querySelectorAll('input[type="number"]').forEach(input => {
        input.addEventListener('input', (e) => {
            let value = e.target.value;
            value = value.replace(',', '.');
            if (value < 0) value = 0;
            e.target.value = value;
        });
    });
</script>
</body>
</html>
