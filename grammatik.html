<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammatik und Rechtschreibprüfung</title>
    <meta name="author" content="KasemSamra">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="bg.jpg">
    <style>
        :root {
            --primary: #e30613;
            --primary-dark: #bf0b10;
            --gradient-start: #ff4b1f;
            --gradient-end: #ff9068;
            --background: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-light: #ffffff;
            --text-gray: #cccccc;
            --animation-speed: 0.3s;
            --shadow-color: rgba(227, 6, 19, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--background);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        .loader {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: relative;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(0.95);
                opacity: 0.8;
            }
        }

        header {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            padding: 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .header-content {
            display: flex;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            transition: all var(--animation-speed);
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            transform: translateX(-5px);
            background: rgba(255, 255, 255, 0.2);
        }

        .title-container {
            flex-grow: 1;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-light);
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .text-check-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all var(--animation-speed);
            margin-bottom: 1.5rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--shadow-color);
        }

        .check-button {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: var(--text-light);
            border: none;
            padding: 1.25rem 2.5rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
            transition: all var(--animation-speed);
            position: relative;
            overflow: hidden;
        }

        .check-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gradient-end), var(--gradient-start));
            opacity: 0;
            transition: opacity var(--animation-speed);
        }

        .check-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .check-button:hover::before {
            opacity: 1;
        }

        .check-button span {
            position: relative;
            z-index: 1;
        }

        #result {
            margin-top: 2rem;
            padding: 2rem;
            border-radius: 12px;
            text-align: left;
            font-size: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
            background: rgba(255, 255, 255, 0.05);
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-content {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-color);
            display: flex; /* Use flexbox for layout */
            flex-direction: column; /* Stack elements vertically */
            align-items: flex-start; /* Align items to the start */
        }

        .error-message {
            color: var(--primary);
            background: rgba(227, 6, 19, 0.1);
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .copy-button {
            background: linear-gradient(135deg, var(--gradient-end), var(--gradient-start)); /* Slightly different gradient */
            color: var(--text-light);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-flex; /* Use flex for icon and text */
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem; /* Space from the text */
            margin-left: auto; /* Pushes the button to the right */
            transition: all var(--animation-speed);
            position: relative;
            overflow: hidden;
        }

        .copy-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            opacity: 0;
            transition: opacity var(--animation-speed);
        }

        .copy-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .copy-button:hover::before {
            opacity: 1;
        }

        .copy-button span, .copy-button i {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .title {
                font-size: 2rem;
            }

            main {
                padding: 1rem;
            }

            .text-check-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loader"></div>
    </div>

    <header>
        <div class="header-content">
            <button class="back-button" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
                <span>Zurück</span>
            </button>
            <div class="title-container">
                <h1 class="title">Grammatik und Rechtschreibprüfung</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="text-check-card">
            <textarea id="textInput" placeholder="Geben Sie Ihren Text hier ein..."></textarea>
            <button class="check-button" onclick="checkText()">
                <span>Text prüfen</span>
            </button>

            <div id="result"></div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 1000);
        });

        async function checkText() {
            const text = document.getElementById('textInput').value;
            const apiKey = 'AIzaSyC22eviRZQMrVpT6Pd9TYa0NggK7icysjc'; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

            const resultElement = document.getElementById('result');
            resultElement.classList.remove('show');
            resultElement.innerHTML = '<p class="loading">Überprüfung läuft...</p>';

            if (!text.trim()) {
                resultElement.innerHTML = `<div class="error-message">Bitte geben Sie Text zur Überprüfung ein.</div>`;
                resultElement.classList.add('show');
                return;
            }

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Bitte korrigieren Sie die Grammatik und Rechtschreibung des folgenden deutschen Textes. Geben Sie nur den korrigierten Text zurück, ohne zusätzliche Erklärungen oder Formatierungen. Wenn der Text bereits korrekt ist, geben Sie ihn unverändert zurück.\n\nText: ${text}`
                            }]
                        }]
                    }),
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates.length > 0) {
                    const correctedText = data.candidates[0].content.parts[0].text;
                    resultElement.innerHTML = `
                        <div class="result-content">
                            <h2>Korrigierter Text:</h2>
                            <p id="correctedOutput">${correctedText}</p>
                            <button class="copy-button" onclick="copyResultText()">
                                <i class="fas fa-copy"></i> <span>Text kopieren</span>
                            </button>
                        </div>
                    `;
                } else {
                    const errorMessage = data.error ? data.error.message : 'Unbekannter Fehler bei der Gemini API.';
                    resultElement.innerHTML = `<div class="error-message">Ein Fehler ist aufgetreten: ${errorMessage}</div>`;
                }
                resultElement.classList.add('show');
            } catch (error) {
                resultElement.innerHTML = `<div class="error-message">Ein Fehler ist aufgetreten: ${error.message}. Bitte überprüfen Sie Ihre Internetverbindung oder die API-Schlüssel.</div>`;
                resultElement.classList.add('show');
            }
        }

        function copyResultText() {
            const correctedOutputElement = document.getElementById('correctedOutput');
            const copyButton = document.querySelector('.copy-button');
            if (correctedOutputElement && copyButton) {
                const textToCopy = correctedOutputElement.innerText;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalButtonContent = copyButton.innerHTML;
                    copyButton.innerHTML = '<i class="fas fa-check"></i> <span>Kopiert!</span>';
                    setTimeout(() => {
                        copyButton.innerHTML = originalButtonContent;
                    }, 2000); // Revert after 2 seconds
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                    // Optionally, show an error message to the user
                });
            }
        }
    </script>
</body>

</html>
